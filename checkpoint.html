<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crime & Investigation · Vocabulary</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:48px 24px;color:#192638;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at 15% 40%,#d3e5fc 0,transparent 60%),radial-gradient(ellipse at 85% 65%,#e5defa 0,transparent 55%),#f2f5fb}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #275fc1;outline-offset:4px}button:disabled{cursor:default}.panel{width:min(100%,1000px);padding:42px 46px 30px;border:1px solid #fff;border-radius:28px;background:rgba(255,255,255,.64);backdrop-filter:blur(24px) saturate(120%);-webkit-backdrop-filter:blur(24px) saturate(120%);box-shadow:inset 0 1px 0 #fff,0 24px 65px #344e851a}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.top h1{font-size:19px;font-weight:500;margin:0}.subtle{font-size:14px;color:#53637a}.progress{width:100%;height:7px;border-radius:9px;background:#5272a51c;margin-top:17px;overflow:hidden}.bar{height:100%;width:0;background:#3976e8;border-radius:9px;transition:width .2s}.prompt-area{text-align:center;padding:42px 10px 30px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#53637a;margin:0 0 17px}.prompt{font-size:clamp(34px,5vw,64px);line-height:1.15;font-weight:650;letter-spacing:-.035em;margin:0;overflow-wrap:anywhere}.prompt.definition{font-size:clamp(25px,3.1vw,36px);line-height:1.3;letter-spacing:-.02em}.instruction{color:#53637a;font-size:17px;margin:19px 0 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answer{min-height:98px;padding:22px 24px;font-size:18px;line-height:1.45;border:1px solid #fff;border-radius:17px;background:#ffffff80;box-shadow:inset 0 1px 0 #ffffffb3,0 4px 12px #38598a0a;transition:background .16s,transform .16s}.answer.wrong{background:#f7e2e4;border-color:#b66a75;color:#792c37}.answer.right{background:#e1f0e9;border-color:#6eaa8b;color:#22563d}.mark{display:block;font-size:12px;font-weight:650;margin-top:7px}.feedback{margin-top:20px;min-height:72px;line-height:1.5;color:#53637a;font-size:15px}.feedback strong{color:#22563d}.feedback p{margin:5px 0}.footer{border-top:1px solid #7995c326;padding-top:20px;display:flex;justify-content:space-between;align-items:center;gap:20px}.stats{line-height:1.7;font-size:14px;color:#53637a}.controls{display:flex;gap:10px;align-items:center}.quiet,.continue{border:0;min-height:46px;padding:12px 19px;border-radius:12px}.quiet{background:transparent;color:#53637a}.continue{background:#3976e8;color:white;font-weight:550}.continue:disabled{background:#a6b6cf66;color:#596c89}.summary h2{font-size:38px;font-weight:600;letter-spacing:-.03em;margin:35px 0 10px}.summary>p{line-height:1.6;color:#53637a}.review{padding:0;list-style:none;margin:25px 0}.review li{border-top:1px solid #7995c326;padding:16px 0;line-height:1.5}.review b{display:block}.review span{color:#53637a}.review small{display:block;color:#53637a;margin-top:5px}[hidden]{display:none!important}@media(hover:hover){.answer:not(:disabled):hover{background:#ffffffc9;transform:translateY(-1px)}.quiet:hover{background:#ffffff70}}button:not(:disabled):active{transform:scale(.985)}@supports not (backdrop-filter:blur(1px)){.panel{background:#f2f5fb}}@media(max-width:600px){body{padding:16px 12px;align-items:start}.panel{padding:24px 19px;border-radius:23px}.top{align-items:start}.top h1{font-size:17px;max-width:160px}.top .subtle{font-size:12px;text-align:right}.prompt-area{padding:30px 0 25px}.answers{grid-template-columns:1fr;gap:10px}.answer{min-height:68px;padding:16px;font-size:16px}.feedback{min-height:64px;margin-top:15px}.footer{flex-wrap:wrap;gap:10px}.controls{width:100%;justify-content:space-between}.continue{min-width:125px}.stats{font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}button{transform:none!important}}
</style></head><body><main class="panel"><header class="top"><h1>Crime & Investigation</h1><span class="subtle" id="learned"></span></header><div class="progress" role="progressbar" aria-label="Mastered vocabulary" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><div class="bar" id="bar"></div></div><section id="practice"><div class="prompt-area"><p class="eyebrow" id="direction"></p><h2 class="prompt" id="prompt" tabindex="-1"></h2><p class="instruction" id="instruction"></p></div><div class="answers" id="answers" role="group" aria-label="Answer choices"></div><div class="feedback" id="feedback" aria-live="polite" aria-atomic="true">Choose an answer. Learn each phrase in both directions.</div><footer class="footer"><div class="stats" id="stats"></div><div class="controls"><button class="quiet" id="restart">Start over</button><button class="continue" id="next" disabled>Continue</button></div></footer></section><section class="summary" id="summary" hidden tabindex="-1"></section></main>
<script>
'use strict';
const words=[
['mugging',"it's when somebody takes a person's money or possessions using violence",'The police are investigating a mugging near the station.',0],
['piracy',"it's when somebody copies software such as CDs and DVDs illegally",'Selling illegal copies of software is piracy.',0],
['theft',"it's when somebody steals something",'She reported the theft of her bicycle.',0],
['law-abiding','following the rules and laws','Most people in the town are law-abiding citizens.',1],
['to accuse a suspect of','to say that they did something bad','They accused the suspect of theft.',2],
['to analyse evidence','to study it in detail','Detectives analysed the evidence carefully.',2],
['to arrest a suspect','to take a suspect to a police station because detectives think they have done something bad.','The police arrested a suspect yesterday.',2],
['to charge a suspect with','to make an official statement that detectives think the suspect did something bad','The police charged the suspect with theft.',2],
['to collect evidence','to get DNA samples or something that can help to show that somebody did something bad','The team collected evidence at the scene.',2],
['to investigate a case','to try to find out what really happened','Detectives are investigating the case.',2],
['to prove something','to give evidence or proof that something is true','The evidence proved that the suspect was there.',2]
];
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let state,queue,current,missed,done,chosen;
function start(){state=words.map(()=>({master:[false,false],errors:0,seen:0,first:false}));queue=shuffle(words.flatMap((_,i)=>[{i,d:0},{i,d:1}]));window.attempts=0;window.correct=0;$('practice').hidden=false;$('summary').hidden=true;show(false)}
function update(){const n=state.filter(s=>s.master.every(Boolean)).length;$('learned').textContent=`${n} / ${words.length} learned`;$('bar').style.width=`${n/words.length*100}%`;document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',n);$('stats').textContent=`Correct: ${correct} / ${attempts} · Accuracy: ${attempts?Math.round(correct/attempts*100):0}%`}
function ensure(i){for(let d=0;d<2;d++)if(!state[i].master[d]&&!queue.some(q=>q.i===i&&q.d===d))queue.push({i,d})}
function show(focus=true){while(queue.length){current=queue.shift();if(!state[current.i].master[current.d])break;current=null}if(!current){finish();return}missed=false;done=false;chosen=new Set();const {i,d}=current;state[i].seen++;$('next').disabled=true;$('prompt').textContent=words[i][d];$('prompt').classList.toggle('definition',d===1);$('direction').textContent=d?'Meaning → phrase':'Phrase → meaning';$('instruction').textContent=d?'Choose the phrase':'Choose the meaning';$('feedback').textContent='Choose an answer. Learn each phrase in both directions.';let same=shuffle(words.map((_,k)=>k).filter(k=>k!==i&&words[k][3]===words[i][3]));let rest=shuffle(words.map((_,k)=>k).filter(k=>k!==i&&!same.includes(k)));let options=shuffle([i,...same.concat(rest).slice(0,3)]);$('answers').replaceChildren(...options.map(k=>{let b=document.createElement('button');b.className='answer';b.textContent=words[k][1-d];b.onclick=()=>answer(k,b);return b}));update();if(focus)$('prompt').focus()}
function answer(k,b){if(done||chosen.has(k))return;chosen.add(k);attempts++;const {i,d}=current,s=state[i];if(k!==i){missed=true;s.errors++;s.master=[false,false];b.classList.add('wrong');const m=document.createElement('span');m.className='mark';m.textContent='Incorrect · try again';b.append(m);b.disabled=true;$('feedback').textContent='Not quite. Try another option.';update();return}correct++;done=true;if(!missed)s.master[d]=true;if(s.seen===1)s.first=!missed;ensure(i);b.classList.add('right');const m=document.createElement('span');m.className='mark';m.textContent='Correct';b.append(m);for(const x of $('answers').children)x.disabled=true;$('feedback').replaceChildren();let p=document.createElement('p'),strong=document.createElement('strong');strong.textContent=`${words[i][0]} — ${words[i][1]}`;p.append(strong);let ex=document.createElement('p');ex.textContent=words[i][2];let note=document.createElement('p');note.textContent=missed?'This phrase will return for another try.':'Correct. Continue when you are ready.';$('feedback').append(p,ex,note);$('next').disabled=false;update()}
function finish(){update();$('practice').hidden=true;const box=$('summary');box.hidden=false;box.replaceChildren();let h=document.createElement('h2');h.textContent='Checkpoint complete';let p=document.createElement('p');p.textContent=`All ${words.length} phrases learned in both directions. Correct responses: ${correct} / ${attempts} (${Math.round(correct/attempts*100)}%). First-encounter success: ${state.filter(s=>s.first).length} / ${words.length}.`;let ul=document.createElement('ul');ul.className='review';words.forEach((w,i)=>{let li=document.createElement('li'),b=document.createElement('b'),span=document.createElement('span'),small=document.createElement('small');b.textContent=w[0];span.textContent=w[1];small.textContent=state[i].errors?`Reviewed after ${state[i].errors} incorrect choice${state[i].errors===1?'':'s'}`:'No incorrect choices';li.append(b,span,small);ul.append(li)});let btn=document.createElement('button');btn.className='continue';btn.textContent='Practice again';btn.onclick=start;box.append(h,p,ul,btn);box.focus()}
$('next').onclick=()=>{if(done){current=null;show()}};$('restart').onclick=start;start();
</script></body></html>
